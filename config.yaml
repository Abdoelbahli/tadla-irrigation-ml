# =============================================================================
# tadla-irrigation-ml — single source of truth for paths, period, CRS and params.
# Every script reads this file; nothing below should be hard-coded elsewhere.
# Values marked `null` are deliberately undecided (see CLAUDE.md "Open points").
# =============================================================================

project:
  name: tadla-irrigation-ml
  gcp_project_env: GCP_PROJECT          # Earth Engine project id is read from .env

paths:
  data_dir: data                         # git-ignored
  outputs_dir: outputs                   # git-ignored; each step writes outputs/<step>/
  docs_dir: docs
  area_shapefile: C:/Users/abdel/OneDrive/Desktop/area/shp/area.shp
  # WARNING (docs/decisions.md D4): this asset is area.shp uploaded WITHOUT the Merchich datum
  # shift, so it sits ~152 m west-south-west of area.shp. Never use it for geometry; the grid
  # (built from area.shp) is sent to Earth Engine in EPSG:26191 instead.
  gee_area_asset: projects/pfe-abdellahelbahli/assets/tadla_area

crs:
  epsg: 26191                            # Merchich / Nord Maroc (same as area.shp)

grid:
  cell_size_m: 1000                      # fixed 1 km grid, built by scripts/01b_build_grid.py
  # cells are aligned on multiples of cell_size_m in EPSG:26191 (same alignment as the old
  # 1 km grid, so old and new cells can be matched one to one)
  file: outputs/01b_grid/grid_1km.gpkg

# -----------------------------------------------------------------------------
# Earth Engine collections (availability checked by scripts/01a_check_collections.py)
# -----------------------------------------------------------------------------
gee:
  collections:
    hls_s30: NASA/HLS/HLSS30/v002        # Sentinel-2 part of HLS v2.0, 30 m
    hls_l30: NASA/HLS/HLSL30/v002        # Landsat 8/9 part of HLS v2.0, 30 m
    chirps_daily: UCSB-CHG/CHIRPS/DAILY
    chirps_pentad: UCSB-CHG/CHIRPS/PENTAD
    era5l_hourly: ECMWF/ERA5_LAND/HOURLY
    era5l_daily: ECMWF/ERA5_LAND/DAILY_AGGR
    era5l_monthly: ECMWF/ERA5_LAND/MONTHLY_AGGR
    modis_ndvi: MODIS/061/MOD13Q1        # optional long-record experiment
  check_years: [1950, 2026]              # years scanned for image counts (ERA5-Land starts in 1950)
  # too large to scan from 1950 or to sort (EE "user memory limit exceeded"): counted from
  # heavy_check_from only, first image not searched. ERA5-Land hourly starts 1950 (catalogue).
  heavy_collections: [era5l_hourly]
  heavy_check_from: 2013
  # MGRS tiles that really cover the study area. filterBounds() also returns HLS tiles of
  # UTM zones 01/60 whose antimeridian-crossing footprints "intersect" everything (checked
  # 2026-11-06); they hold no pixels here but inflate image counts, so HLS is filtered by tile.
  hls_tiles: [T29SPR, T29SQR, T29SQS]

period:
  # Confirmed 2026-11-06 after checking each collection in Earth Engine (docs/decisions.md D1):
  # HLS S30 starts 2015-11-29 -> 2016 is the first complete year; every collection is
  # complete for 2025 and partial for 2026.
  start_year: 2016
  end_year: 2025
  old_period: [2017, 2023]               # Sentinel-2-era period of the old work (for comparison)
  modis_experiment: [2001, 2025]         # OPTIONAL long-record experiment (MOD13Q1 starts 2000-02-18)

# -----------------------------------------------------------------------------
# Irrigation (FAO-56). The Kc–NDVI coefficients are an OPEN POINT (CLAUDE.md §1–2):
# they must be checked against Duchemin et al. 2006 and Bausch & Neale 1987
# before any value is entered here. Left null on purpose.
# -----------------------------------------------------------------------------
irrigation:
  kc_ndvi:
    duchemin_2006: {a: null, b: null}
    bausch_neale_1987: {a: null, b: null}
  kc_clip: [0.0, 1.3]
  ndvi_vegetated_min: 0.20
  stress_ndvi_max: 0.30

# -----------------------------------------------------------------------------
# Phase 0 — inventory of the old material (read-only walk, nothing is deleted)
# -----------------------------------------------------------------------------
inventory:
  roots:
    - C:/Users/abdel/OneDrive/Desktop/train
    - C:/Users/abdel/OneDrive/Desktop/PFE_Project
    - D:/CHIRPS
    - D:/climat_data
    - D:/COMBINED_DATA
    - D:/ERA5
    - D:/ERA5-11
    - D:/NDVI_NetCDF
  report: docs/cleanup_report.md
  full_listing_csv: outputs/00_inventory/inventory_full.csv
  n_largest: 30
  heavy_file_gb: 0.1                     # OneDrive "heavy" threshold (GB = 1e9 bytes)
  small_derived_mb: 10                   # derived tables below this size are kept (category C)
